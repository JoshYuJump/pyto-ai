[project]
name = "pyto-ai"
version = "0.1.2"
description = "A lightweight, extensible Python-first Code Agent framework for code generation, execution, and tooling with LLMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.119,<1",
    "ddgs>=9.14,<9.15",
    "pydantic-ai>=1.107,<2",
    "python-dotenv>=1.2.2,<2",
    "rich>=15,<16",
    "toml>=0.10.2,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.1.0",
]

[project.scripts]
pyto = "pyto.main:main"

[tool.hatch.build.targets.sdist]
include = ["pyto"]

[tool.hatch.build.targets.wheel]
include = ["pyto"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
